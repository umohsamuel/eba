services:
  postgres:
    image: postgres:17.4
    container_name: notification_pg
    volumes:
      - notification_pg_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE:-notification}
      PGPORT: ${DB_PORT:-5433}
    ports:
      - "${DB_PORT:-5433}:${DB_PORT:-5433}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - notification_network
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.27
    container_name: eba_mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - notification_network
    restart: unless-stopped

volumes:
  notification_pg_data:
    driver: local

networks:
  notification_network:
    driver: bridge
