services:
  postgres:
    image: postgres:17.4
    container_name: notification_pg
    volumes:
      - notification_pg_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE:-notification}
      PGPORT: ${DB_PORT:-5433}
    ports:
      - "${DB_PORT:-5433}:${DB_PORT:-5433}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - notification_network
    restart: unless-stopped

  kafka:
    image: apache/kafka:3.9.1
    container_name: eba_kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: HOST://0.0.0.0:9092,DOCKER://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: HOST://localhost:9092,DOCKER://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: HOST:PLAINTEXT,DOCKER:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      - "9092:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - notification_network
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.27
    container_name: eba_mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - notification_network
    restart: unless-stopped

volumes:
  notification_pg_data:
    driver: local
  kafka_data:
    driver: local

networks:
  notification_network:
    driver: bridge
