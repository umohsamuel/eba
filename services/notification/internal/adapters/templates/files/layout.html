{{define "layout"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.app_name}}</title>
</head>
<body style="margin:0;padding:0;background:#f4f4f5;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#18181b;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f4f5;padding:32px 16px;">
<tr><td align="center">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;background:#ffffff;border-radius:8px;padding:32px;">
<tr><td style="font-size:20px;font-weight:600;padding-bottom:24px;">{{.app_name}}</td></tr>
<tr><td style="font-size:15px;line-height:1.6;">{{template "content" .}}</td></tr>
</table>
<p style="font-size:12px;color:#71717a;margin-top:16px;">You received this email because of activity on your {{.app_name}} account.</p>
</td></tr>
</table>
</body>
</html>{{end}}

{{define "button"}}<p style="margin:24px 0;"><a href="{{.url}}" style="display:inline-block;background:#18181b;color:#ffffff;text-decoration:none;padding:12px 20px;border-radius:6px;font-weight:600;">{{.label}}</a></p>
<p style="font-size:13px;color:#52525b;">If the button doesn't work, copy this link into your browser:<br><a href="{{.url}}" style="color:#2563eb;word-break:break-all;">{{.url}}</a></p>{{end}}
