info:
  contact: {}
  description: This is the auth service for EBA.
  title: Auth Service
  version: "1.0"
paths:
  /auth/forgot-password:
    post:
      consumes:
      - application/json
      description: |-
        Sends a password reset link if an account exists for the email. The response is the same
        whether or not the account exists.
      parameters:
      - description: Account email
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_adapters_transport_http_handlers.forgotPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Envelope-any'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Envelope-any'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Envelope-any'
      summary: Request a password reset
      tags:
      - auth
  /auth/login:
    post:
      consumes:
      - application/json
      description: |-
        Authenticates a user. Web clients (default) receive the tokens as HttpOnly cookies and only
        their expiry times in the body. Clients sending X-Client-Type: mobile receive the tokens in
        the body and no cookies.
      parameters:
      - description: Client type
        enum:
        - web
        - mobile
        in: header
        name: X-Client-Type
        type: string
      - description: Login credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_adapters_transport_http_handlers.loginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Envelope-github_com_umohsamuel_eba_services_auth_internal_services_auth_LoginResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Envelope-any'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Envelope-any'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Envelope-any'
      summary: Log in
      tags:
      - auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: |-
        Exchanges a valid refresh token for a new access token. Web clients (default) send no body;
        the refresh token is read from its cookie and the new access token is set as a cookie.
        Clients sending X-Client-Type: mobile send the refresh token in the body and receive the
        tokens in the response.
      parameters:
      - description: Client type
        enum:
        - web
        - mobile
        in: header
        name: X-Client-Type
        type: string
      - description: Refresh token (mobile clients only)
        in: body
        name: request
        schema:
          $ref: '#/definitions/internal_adapters_transport_http_handlers.refreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Envelope-github_com_umohsamuel_eba_services_auth_internal_services_auth_TokenConfig'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Envelope-any'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Envelope-any'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Envelope-any'
      summary: Refresh access token
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Creates a user account with an email and password.
      parameters:
      - description: Registration details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_adapters_transport_http_handlers.registerRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/response.Envelope-github_com_umohsamuel_eba_services_auth_internal_domain_user_User'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Envelope-any'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/response.Envelope-any'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Envelope-any'
      summary: Register a new user
      tags:
      - auth
  /auth/reset-password:
    post:
      consumes:
      - application/json
      description: |-
        Sets a new password using the token from the reset link. The token works once, and all
        existing sessions are signed out.
      parameters:
      - description: Reset token and new password
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_adapters_transport_http_handlers.resetPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Envelope-any'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Envelope-any'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Envelope-any'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Envelope-any'
      summary: Reset password
      tags:
      - auth
  /migrations/down-to/{version}:
    post:
      description: Rolls back every applied migration newer than the given version.
        Version 0 rolls back everything.
      parameters:
      - description: Migration token
        in: header
        name: X-Migration-Token
        required: true
        type: string
      - description: Target version
        in: path
        name: version
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Envelope-array_github_com_umohsamuel_eba_services_auth_internal_adapters_db_migrations_Result'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Envelope-any'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Envelope-any'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Envelope-any'
      summary: Roll back migrations down to a version
      tags:
      - migrations
  /migrations/status:
    get:
      description: Lists every migration and whether it is applied or pending.
      parameters:
      - description: Migration token
        in: header
        name: X-Migration-Token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Envelope-array_github_com_umohsamuel_eba_services_auth_internal_adapters_db_migrations_Status'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Envelope-any'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Envelope-any'
      summary: Migration status
      tags:
      - migrations
  /migrations/up:
    post:
      parameters:
      - description: Migration token
        in: header
        name: X-Migration-Token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Envelope-array_github_com_umohsamuel_eba_services_auth_internal_adapters_db_migrations_Result'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Envelope-any'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Envelope-any'
      summary: Apply all pending migrations
      tags:
      - migrations
  /migrations/up-to/{version}:
    post:
      parameters:
      - description: Migration token
        in: header
        name: X-Migration-Token
        required: true
        type: string
      - description: Target version
        in: path
        name: version
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Envelope-array_github_com_umohsamuel_eba_services_auth_internal_adapters_db_migrations_Result'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Envelope-any'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Envelope-any'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Envelope-any'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Envelope-any'
      summary: Apply pending migrations up to a version
      tags:
      - migrations
  /migrations/version:
    get:
      parameters:
      - description: Migration token
        in: header
        name: X-Migration-Token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Envelope-internal_adapters_transport_http_handlers_versionResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Envelope-any'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Envelope-any'
      summary: Current schema version
      tags:
      - migrations
schemes:
- http
securityDefinitions:
  BearerAuth:
    description: Enter "Bearer" followed by a space and the access token.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
