  response.Envelope-github_com_umohsamuel_eba_services_auth_internal_domain_user_User:
    properties:
      data:
        $ref: '#/definitions/github_com_umohsamuel_eba_services_auth_internal_domain_user.User'
      error:
        $ref: '#/definitions/response.APIError'
      message:
        type: string
      meta:
        $ref: '#/definitions/response.Meta'
      status:
        type: string
    type: object
  response.Envelope-github_com_umohsamuel_eba_services_auth_internal_services_auth_LoginResponse:
    properties:
